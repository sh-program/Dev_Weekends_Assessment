<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Pomodoro Timer</h1>

        <div class="timer-card">

            <div id="mode" class="mode focus">
                Focus Session
            </div>

            <div id="timer" class="timer">
                25:00
            </div>

            <div class="status" id="status">
                Ready to Start
            </div>

            <div class="controls">

                <button id="startBtn">Start</button>
                <button id="pauseBtn">Pause</button>
                <button id="resumeBtn">Resume</button>
                <button id="resetBtn">Reset</button>

            </div>

        </div>

        <div class="settings-card">

            <h2>Timer Settings</h2>

            <div class="input-group">

                <label for="focusMinutes">Focus Duration (minutes)</label>

                <input type="number" id="focusMinutes" min="1" value="25">

            </div>

            <div class="input-group">

                <label for="breakMinutes">Break Duration (minutes)</label>

                <input type="number" id="breakMinutes" min="1" value="5">

            </div>

        </div>

        <div class="history-card">

            <h2>Today's Focus Sessions</h2>

            <ul id="historyList">
                <li class="empty-history">No sessions completed yet.</li>
            </ul>

        </div>

        <div id="alarmControls" class="alarm-controls" style="display:none;">

            <button id="stopAlarmBtn">Stop Alarm</button>
            <button id="snoozeBtn">Snooze 1 Min</button>

        </div>

    </main>

    <audio id="alarm" preload="auto">
        <source src="alarm.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>

</html>
